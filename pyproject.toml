[project]
name = "black-hole-minmax"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "psaunderualberta", email = "psaunder@ualberta.ca" }
]
requires-python = ">=3.11"
dependencies = [
    "chex>=0.1.90",
    "equinox==0.13.0",
    "greenlet==3.0.3",
    "jax==0.4.38",
    "jaxlib==0.4.38",
    "jaxtyping==0.3.2",
    "ml-dtypes==0.5.3",
    "msgpack==1.0.8",
    "numpy==2.3.2",
    "opt-einsum==3.4.0",
    "pynvim==0.5.0",
    "scipy==1.16.1",
    "setuptools==78.1.1",
    "typing-extensions==4.15.0",
    "wadler-lindig==0.1.7",
    "wheel==0.45.1",
]

[project.scripts]
black-hole-minmax = "black_hole_minmax:main"

[build-system]
requires = ["uv_build>=0.8.23,<0.9.0"]
build-backend = "uv_build"
